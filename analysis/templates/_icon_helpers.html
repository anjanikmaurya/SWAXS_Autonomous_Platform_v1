<script>
/* Platform icon helpers (generated by tools/build_icon_sprite.py — do not edit). */
function icoSvg(n){return '<svg class="ico" aria-hidden="true"><use href="#swaxs-ui-'+n+'"/></svg>';}
function setIco(el,n,text){if(!el)return;el.innerHTML=icoSvg(n)+' ';el.appendChild(document.createTextNode(text==null?'':String(text)));}
/* Keep every open SWAXS tab on one theme: a toggle in any app is saved under the
   shared key, and the others follow through the storage event. */
window.addEventListener('storage',function(e){if(e.key!=='swaxs-theme'||!e.newValue)return;
  if(document.documentElement.getAttribute('data-theme')!==e.newValue&&typeof window.toggleTheme==='function')window.toggleTheme();});
/* Charts follow the theme too. swaxsPlotTheme() = current palette for a chart;
   swaxsRethemePlots() re-colours every Plotly chart on the page, and runs on its
   own whenever data-theme changes, so no app has to remember to redraw. */
function swaxsPlotTheme(){var c=getComputedStyle(document.documentElement),
  g=function(n,d){return (c.getPropertyValue(n)||'').trim()||d;};
  return {bg:g('--surface','#fff'),fg:g('--txt','#1f2937'),muted:g('--muted','#4b5563'),
    grid:g('--border','#e5e7eb'),line:g('--border-strong','#c3c9d1'),legend:g('--surface','#fff'),
    err:g('--err-text','#b91c1c'),accent:g('--accent','#B1040E')};}
function swaxsRethemePlots(){if(!window.Plotly)return;var T=swaxsPlotTheme();
  var clear=function(v){return !v||v==='transparent'||/rgba\([^)]*,\s*0\)/.test(String(v));};
  document.querySelectorAll('.js-plotly-plot').forEach(function(el){try{
    var L=el.layout||{},u={'font.color':T.fg,'title.font.color':T.fg,'legend.bgcolor':T.legend,'legend.bordercolor':T.grid};
    if(!clear(L.plot_bgcolor))u.plot_bgcolor=T.bg; if(!clear(L.paper_bgcolor))u.paper_bgcolor=T.bg;
    Object.keys(L).forEach(function(k){if(/^[xy]axis\d*$/.test(k)){u[k+'.gridcolor']=T.grid;u[k+'.linecolor']=T.line;u[k+'.color']=T.muted;}});
    window.Plotly.relayout(el,u);}catch(e){}});}
/* Carry the theme along on every link to another SWAXS app (hub Open buttons,
   ← Hub links): add ?theme=<current> just before the browser follows it. */
document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href]');if(!a)return;
  try{var u=new URL(a.href,location.href);if(!/^(localhost|127\.0\.0\.1)$/.test(u.hostname)||u.port===location.port)return;
    u.searchParams.set('theme',document.documentElement.getAttribute('data-theme')||'light');a.href=u.toString();}catch(_){}},true);
/* Uniform top bar: apps without their own live status / project display carry
   the standard placeholders (#barStatus, #barProject); fill them from the app's
   own /api/health and /api/project so every bar shows the same information. */
(function(){
  function stat(){var el=document.getElementById('barStatus');if(!el)return;var t=el.querySelector('.bar-status-txt');
    fetch('/api/health',{cache:'no-store'}).then(function(r){el.classList.toggle('ok',r.ok);el.classList.toggle('down',!r.ok);
      if(t)t.textContent=r.ok?'Connected':'Offline';}).catch(function(){el.classList.remove('ok');el.classList.add('down');if(t)t.textContent='Offline';});}
  function proj(){var el=document.getElementById('barProject');if(!el)return;
    fetch('/api/project',{cache:'no-store'}).then(function(r){return r.ok?r.json():{};}).then(function(d){
      var p=(d&&(d.project_root||d.root||d.project))||'';el.textContent=p||'no project selected';
      el.title=p?('Project folder: '+p):'No project selected in the hub';}).catch(function(){});}
  function go(){stat();proj();setInterval(stat,5000);setInterval(proj,30000);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
/* Shared folder picker for every Browse… button: swaxsBrowse('inputId', after).
   Lists folders through the app's own GET /api/browse ({current,parent,dirs}),
   starts at the folder already typed (relative paths open inside the project),
   writes the chosen path into the input, fires its change event, then calls
   after() if given (e.g. the app's Set). Names go in as TEXT, never as HTML. */
function swaxsBrowse(id,after){var inp=document.getElementById(id);if(!inp)return;
  var bd=document.createElement('div');bd.className='swx-pick-bd';
  var m=document.createElement('div');m.className='swx-pick';m.setAttribute('role','dialog');m.setAttribute('aria-label','Choose a folder');
  m.innerHTML='<div class="swx-pick-hd"><b>Choose a folder</b><button type="button" class="swx-pick-x" aria-label="Close">'+icoSvg('close')+'</button></div>'
   +'<div class="swx-pick-path"><button type="button" class="btn btn-ghost btn-sm swx-up">↑ Up</button><input type="text" class="swx-cur" spellcheck="false"></div>'
   +'<div class="swx-pick-list"></div>'
   +'<div class="swx-pick-ft"><button type="button" class="btn btn-ghost btn-sm swx-can">Cancel</button><button type="button" class="btn btn-primary btn-sm swx-ok">Select this folder</button></div>';
  bd.appendChild(m);document.body.appendChild(bd);
  var cur=m.querySelector('.swx-cur'),list=m.querySelector('.swx-pick-list'),up=m.querySelector('.swx-up'),par=null;
  function close(){document.removeEventListener('keydown',key,true);bd.remove();}
  function key(e){if(e.key==='Escape'){e.stopPropagation();close();}}
  function load(path){list.textContent='Loading…';
    fetch('/api/browse?path='+encodeURIComponent(path||''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      cur.value=d.current||'';par=d.parent;up.disabled=!par;list.textContent='';
      (d.dirs||[]).forEach(function(n){var b=document.createElement('button');b.type='button';b.className='swx-dir';
        b.innerHTML=icoSvg('folder')+' ';b.appendChild(document.createTextNode(n));
        b.onclick=function(){load((d.current||'').replace(/[\\/]+$/,'')+'/'+n);};
        list.appendChild(b);});
      if(!(d.dirs||[]).length){var e=document.createElement('div');e.className='swx-empty';e.textContent='No sub-folders here.';list.appendChild(e);}
    }).catch(function(){list.textContent='Could not list this folder.';});}
  m.querySelector('.swx-pick-x').onclick=close;m.querySelector('.swx-can').onclick=close;
  bd.addEventListener('mousedown',function(e){if(e.target===bd)close();});
  up.onclick=function(){if(par)load(par);};
  cur.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();load(cur.value);}});
  m.querySelector('.swx-ok').onclick=function(){inp.value=cur.value;close();
    inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}));
    if(typeof after==='function')after();};
  document.addEventListener('keydown',key,true);load(inp.value);}
if(window.MutationObserver)new MutationObserver(function(){swaxsRethemePlots();})
  .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
