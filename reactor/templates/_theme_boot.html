<script>
/* Platform theme boot (generated by tools/build_icon_sprite.py — do not edit). */
(function(){var d;try{
/* Each app runs on its own port, and the browser keeps saved settings per port,
   so a theme chosen in one app does not exist in another. Links between apps
   carry ?theme=…; adopt it here so moving between apps keeps the theme. */
var q=new URLSearchParams(location.search).get('theme');
if(q==='dark'||q==='light'){localStorage.setItem('swaxs-theme',q);}
var s=localStorage.getItem('swaxs-theme');
d=s?s==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}catch(e){d=true;}
document.documentElement.setAttribute('data-theme',d?'dark':'light');})();
</script>
